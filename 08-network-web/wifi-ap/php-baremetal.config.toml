name = "wifi-ap"
type = "init-loop"          # execution model

[esp32]
preset = "waveshare-esp32-s3-zero"    # any WiFi-capable board (ESP32 / ESP32-S3 / C-series), or an ESP32-P4 with a WiFi companion (esp32-p4-wifi-c6)
port   = ""          # empty = autodetect at flash time
storage_type = "embedded"   # PHP source packed into flash

[esp32.idf]
path    = ""
version = ""

[esp32.sdk]
path    = ""
version = ""

# WiFi from PHP. Here the board CREATES a network (SoftAP) that you connect to.
[extensions.wifi]
enabled = true

[php]
src   = "project-src"      # PHP source folder (packed into the embedded image)
entry = "index.php"    # entry file within src
