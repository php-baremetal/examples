name = "ext-selftest"
type = "init-loop"          # runs start to finish and stops

[esp32]
preset = "waveshare-esp32-s3-zero"    # an ESP32-S3 board (so the onboard-RGB extension is available)
port   = ""          # empty = autodetect at flash time
storage_type = "embedded"   # a linear script packed into flash; no card needed

[esp32.idf]
path    = ""
version = ""

[esp32.sdk]
path    = ""
version = ""

# Turn the opt-in native extensions on so the self-test can exercise them. The script guards each one
# with function_exists()/_available(), so it still runs on a build with fewer extensions compiled in.
[extensions.wifi]
enabled = true

[extensions.led]
enabled = true
leds    = ["ws2812"]

[store]
size_kb = 32   # give the persistent store a partition, so store_* can round-trip

[php]
src   = "project-src"      # PHP source folder (packed into the embedded image)
entry = "index.php"    # entry file within src
